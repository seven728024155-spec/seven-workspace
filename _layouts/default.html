<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="theme-color" content="#0f172a" />
  <title>{% if page.title %}{{ page.title }} · seven 的工作空间{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">⚙︎</span>
        <span class="brand-name">seven 的工作空间</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/posts/' | relative_url }}">文章</a>
        <a href="{{ '/files/' | relative_url }}">下载</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> seven 的工作空间 · 由 GitHub Pages 强力驱动</p>
    </div>
  </footer>

  <script>
    // 年份回填（不依赖 main.js，让 Liquid 页面也能用）
    document.getElementById('year') &&
      (document.getElementById('year').textContent = new Date().getFullYear());
  </script>
  {% if page.url == '/' or page.url == '/index.html' %}
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% endif %}
  {% if page.url contains '/files' %}
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
